<!DOCTYPE html>
<html>

<head>
  <base href="/MerajXo/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description"
    content="MERAJXO — Creative portfolio. Projects, scripts, effects, software and music in one place.">

  <!-- iOS meta tags for mobile web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MERAJXO">
  <meta name="theme-color" content="#000000">

  <!-- Favicon — a 32×32 PNG placed at web/favicon.png -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Web App Manifest — gives install-to-home-screen + theme color -->
  <link rel="manifest" href="manifest.json">

  <title>MERAJXO</title>

  <style>
    /* Boot loader — shown until Flutter takes over the screen. */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 280ms ease-out;
      z-index: 9999;
    }

    #loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0A84FF 0%, #5E5CE6 55%, #FF375F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(10, 132, 255, 0.35);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      color: #fff;
    }

    .label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.6);
    }

    .bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar>span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0A84FF, #5E5CE6, #FF375F);
      border-radius: 999px;
      transition: width 280ms ease-out;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(0.94);
        opacity: 0.7;
      }
    }
  </style>
</head>

<body>
  <!-- Boot loader — the JS below updates the inner progress bar. -->
  <div id="loading-container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </div>
    <div class="bar"><span id="progress-bar"></span></div>
    <div class="label" id="progress-label">Starting…</div>
  </div>

  <!-- Flutter loads here. -->
  <script>
    // ── SPA deep-link restoration ──────────────────────────────────
    // GitHub Pages serves 404.html for any URL that doesn't match a
    // real static file — including all our Flutter routes like
    // /MerajXo/project/foo. 404.html saves the requested URL to
    // sessionStorage and redirects here. We restore that URL via
    // history.replaceState BEFORE Flutter boots, so Flutter's
    // getCurrentPath() picks up the deep link and routes correctly.
    (function () {
      try {
        var saved = sessionStorage.getItem('mxo_redirect');
        if (saved) {
          sessionStorage.removeItem('mxo_redirect');
          // Replace the URL bar with the deep link, without triggering
          // a navigation. The page content stays as index.html.
          history.replaceState(null, '', saved);
        }
      } catch (_) { }
    })();

    // The boot loader's progress bar. `appProgress(value, label)` is
    // called from main.dart during app startup (see web_bridge_web.dart).
    var _bar = document.getElementById('progress-bar');
    var _label = document.getElementById('progress-label');
    var _container = document.getElementById('loading-container');

    function appProgress(value, label) {
      try {
        if (_bar) _bar.style.width = Math.max(0, Math.min(1, value)) * 100 + '%';
        if (_label && label) _label.textContent = label;
      } catch (_) { }
    }

    function appReady() {
      try {
        if (_container) {
          _container.classList.add('fade-out');
          setTimeout(function () {
            if (_container && _container.parentNode) {
              _container.parentNode.removeChild(_container);
            }
          }, 320);
        }
      } catch (_) { }
    }

  </script>

  <!-- Flutter entry point. Generated by `flutter build web`. -->
  <script src="main.dart.js" defer></script>
</body>

</html>
