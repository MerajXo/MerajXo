<!DOCTYPE html>
<html>

<head>
  <!--
    The /MerajXo/ placeholder is substituted by the Flutter
    build tool at build time using the value you pass to
    `--base-href`. Examples:

      flutter build web --base-href "/MerajXo/"   →  <base href="/MerajXo/">
      flutter build web --base-href "/"           →  <base href="/">

    If you don't pass --base-href, Flutter defaults to "/".

    DO NOT replace this with a hardcoded path — the build will fail
    with "Couldn't find the placeholder for base href".
  -->
  <base href="/MerajXo/">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description"
    content="MERAJXO — Creative portfolio. Projects, scripts, effects, software and music in one place.">

  <!-- iOS meta tags for mobile web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MERAJXO">
  <meta name="theme-color" content="#000000">

  <!-- Favicon — a 32×32 PNG placed at web/favicon.png -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Web App Manifest — gives install-to-home-screen + theme color -->
  <link rel="manifest" href="manifest.json">

  <title>MERAJXO</title>

  <style>
    /* ── iOS-inspired boot loader ─────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
        'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 400ms ease-out;
      z-index: 9999;
      -webkit-font-smoothing: antialiased;
    }

    #loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Wordmark ── */
    .wordmark {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    /* ── iOS-style spinner ── */
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    /* ── Status label (subtle, below spinner) ── */
    .label {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.4);
      transition: opacity 200ms ease-out;
      min-height: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Respect reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2.5s;
      }
    }
  </style>
</head>

<body>
  <!-- Boot loader — minimal iOS-style. -->
  <div id="loading-container">
    <div class="wordmark">MerajXO</div>
    <div class="spinner"></div>
    <div class="label" id="progress-label">Loading</div>
  </div>

  <!-- Flutter loads here. -->
  <script>
    // ── SPA deep-link restoration ──────────────────────────────────
    // GitHub Pages serves 404.html for any URL that doesn't match a
    // real static file — including all our Flutter routes like
    // /MerajXo/project/foo. 404.html saves the requested URL to
    // sessionStorage and redirects here. We restore that URL via
    // history.replaceState BEFORE Flutter boots, so Flutter's
    // getCurrentPath() picks up the deep link and routes correctly.
    (function () {
      try {
        var saved = sessionStorage.getItem('mxo_redirect');
        if (saved) {
          sessionStorage.removeItem('mxo_redirect');
          // Replace the URL bar with the deep link, without triggering
          // a navigation. The page content stays as index.html.
          history.replaceState(null, '', saved);
        }
      } catch (_) { }
    })();

    // The boot loader's progress. `appProgress(value, label)` is
    // called from main.dart during app startup (see web_bridge_web.dart).
    var _label = document.getElementById('progress-label');
    var _container = document.getElementById('loading-container');

    function appProgress(value, label) {
      try {
        // No progress bar — the spinner IS the progress indicator.
        // Just cross-fade the label text.
        if (_label && label) {
          _label.style.opacity = '0';
          setTimeout(function () {
            _label.textContent = label;
            _label.style.opacity = '1';
          }, 160);
        }
      } catch (_) { }
    }

    function appReady() {
      try {
        if (_container) {
          _container.classList.add('fade-out');
          setTimeout(function () {
            if (_container && _container.parentNode) {
              _container.parentNode.removeChild(_container);
            }
          }, 440);
        }
      } catch (_) { }
    }
  </script>

  <!-- Flutter entry point. Generated by `flutter build web`. -->
  <script src="main.dart.js" defer></script>
</body>

</html>
