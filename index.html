<!DOCTYPE html>
<html lang="en">
<head>
  <!-- <base href="/MerajXo/"> -->
  <base href="/">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MERAJXO — portfolio, scripts, music library and more.">
  <meta name="theme-color" content="#070708">
  <meta name="color-scheme" content="dark light">
  <title>MERAJXO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #070708; }
    #boot {
      position: fixed; inset: 0; z-index: 2147483647;
      display: grid; place-items: center;
      background:
        radial-gradient(90% 70% at 15% 10%, rgba(255,122,89,.08), transparent 60%),
        radial-gradient(90% 70% at 85% 90%, rgba(77,216,255,.07), transparent 60%),
        #070708;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .65s ease, visibility .65s ease;
    }
    #boot.boot-done { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-card { width: min(340px, 80vw); text-align: center; }
    /* subtle text wordmark — delete this element in the HTML below for zero branding */
    .boot-word {
      font-size: 12px; font-weight: 700; color: #6f6f78;
      letter-spacing: .5em; text-indent: .5em; margin-bottom: 26px;
    }
    .boot-track {
      height: 3px; border-radius: 999px;
      background: rgba(255,255,255,.07); overflow: hidden;
    }
    #bootFill {
      height: 100%; width: 0%; border-radius: inherit;
      background: linear-gradient(90deg, #4dd8ff, #ffffff, #ff7a59);
      background-size: 220% 100%;
      animation: bootSheen 1.7s linear infinite;
      transition: width .35s cubic-bezier(.4,0,.2,1);
    }
    .boot-msg {
      margin-top: 16px; height: 20px;
      font-size: 13px; font-weight: 500; color: #9a9aa4;
      letter-spacing: .02em;
    }
    #bootMsg {
      display: inline-block;
      transition: opacity .35s ease, transform .35s ease;
    }
    #bootMsg.swap { opacity: 0; transform: translateY(4px); }
    .boot-pct {
      margin-top: 6px; font-size: 11px; font-weight: 600;
      color: #5c5c64; font-variant-numeric: tabular-nums;
    }
    @keyframes bootSheen { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) {
      #bootFill { animation: none; }
      #bootMsg { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <div class="boot-card">
      <div class="boot-word">MERAJXO</div>
      <div class="boot-track"><div id="bootFill"></div></div>
      <div class="boot-msg"><span id="bootMsg">Warming up…</span></div>
      <div class="boot-pct" id="bootPct">0%</div>
    </div>
    <noscript><p style="color:#8a8a92">MERAJXO needs JavaScript to run.</p></noscript>
  </div>

  <script>
    // ── Boot monitor ─────────────────────────────────────────────────
    // Real milestones push the bar; poetic messages rotate between
    // them. Dart reports 0.50–0.84 from main(); the first rendered
    // frame completes the run. Stalls creep gently — never lie.
    (function () {
      var root = document.getElementById('boot');
      var fill = document.getElementById('bootFill');
      var pct = document.getElementById('bootPct');
      var msg = document.getElementById('bootMsg');
      var target = 0.05, shown = 0, done = false;
      var started = performance.now(), lastMove = started;
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      var poems = [
        'Warming up the engine…',
        'Mixing colors in the dark…',
        'Sharpening every pixel…',
        'Tuning the typography…',
        'Loading your workspace…',
        'Counting projects and scripts…',
        'Almost ready…',
      ];
      var poemIndex = 0, holdUntil = 0;

      function say(text) {
        if (msg.textContent === text) return;
        msg.classList.add('swap');
        setTimeout(function () {
          msg.textContent = text;
          msg.classList.remove('swap');
        }, 220);
      }

      // Dart milestones call this — real labels pause the poetry briefly.
      window.appProgress = function (p, text) {
        p = Number(p);
        if (isFinite(p) && p > target && p < 1) { target = p; lastMove = performance.now(); }
        if (typeof text === 'string' && text) {
          say(text);
          holdUntil = performance.now() + 2600;
        }
      };
      window.appReady = function () { target = 1; };
      window.addEventListener('flutter-first-frame', window.appReady);
      window.addEventListener('flutter-error', function () {
        say('Startup hit a snag — see console');
      });
      window.bootFail = function (text) {
        target = Math.max(target, 0.85);
        say(text);
        holdUntil = Infinity;
      };

      setInterval(function () {
        if (done || performance.now() < holdUntil) return;
        say(poems[poemIndex++ % poems.length]);
      }, 1900);

      function tick(now) {
        if (!done) {
          var idle = now - lastMove;
          if (target < 0.85 && idle > 3500) {
            target = Math.min(target + 0.012, 0.85);
            lastMove = now - 3200;
          }
          if (target < 1 && now - started > 25000) {
            say('Still loading — slow connection?');
            holdUntil = performance.now() + 6000;
            started = now; // keep the reminder from spamming
          }
        }
        shown += (target - shown) * (reduce ? 1 : 0.09);
        if (target - shown < 0.002) shown = target;
        fill.style.width = (shown * 100).toFixed(2) + '%';
        pct.textContent = Math.round(shown * 100) + '%';
        if (shown >= 1 && !done) {
          done = true;
          say('Ready');
          root.classList.add('boot-done');
          setTimeout(function () { root.remove(); }, 700);
          return;
        }
        if (!done) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
